apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-account
  namespace: opscope-scenarios
spec:
  replicas: 1
  selector:
    matchLabels: {app: missing-account}
  template:
    metadata:
      labels: {app: missing-account}
    spec:
      serviceAccountName: ghost
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            limits: {memory: 32Mi}
          command: ["sh", "-c", "sleep 3600"]
