# One case for every signal type a plain kind cluster can show, each next to
# nothing else that fails, for the Issues feed (docs/design/issues.md). The
# README says which signal each should raise. Types a kind cluster can't
# show (evicted, nodes, Gateway API status, volumes filling up) are tested
# with fakes in backend/internal/signals.
apiVersion: v1
kind: Namespace
metadata:
  name: issues-test
---
# crash_loop: exits a few seconds after starting, again and again.
apiVersion: v1
kind: Pod
metadata:
  name: crash
  namespace: issues-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, "echo starting; sleep 2; exit 1"]
      resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { memory: 16Mi } }
---
# oom_killed, then crash_loop: doubles a string past its 16 MiB limit.
apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: issues-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, 'x=a; while true; do x="$x$x"; done']
      resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { memory: 16Mi } }
---
# container_error: fails once, and is never restarted.
apiVersion: v1
kind: Pod
metadata:
  name: once
  namespace: issues-test
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, "echo bad input; exit 2"]
---
# image_pull_failed: the .invalid domain never resolves.
apiVersion: v1
kind: Pod
metadata:
  name: bad-image
  namespace: issues-test
spec:
  containers:
    - name: app
      image: registry.invalid/shop:1
---
# config_missing: a key from a Secret that doesn't exist.
apiVersion: v1
kind: Pod
metadata:
  name: no-secret
  namespace: issues-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "86400"]
      env:
        - name: PASSWORD
          valueFrom:
            secretKeyRef: { name: db-creds, key: password }
---
# init_failing: the init container fails, so the pod never starts.
apiVersion: v1
kind: Pod
metadata:
  name: bad-init
  namespace: issues-test
spec:
  initContainers:
    - name: migrate
      image: busybox:1.36
      command: [sh, -c, "echo migration failed; exit 1"]
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "86400"]
---
# unschedulable: no node has this label.
apiVersion: v1
kind: Pod
metadata:
  name: nowhere
  namespace: issues-test
spec:
  nodeSelector:
    opscope.example/zone: moon
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "86400"]
---
# mount_failed (after its 2-minute wait): a ConfigMap volume that doesn't
# exist keeps the pod in ContainerCreating. reference_missing too: the pod
# has no workload, so it's the one referring.
apiVersion: v1
kind: Pod
metadata:
  name: no-volume
  namespace: issues-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "86400"]
      volumeMounts:
        - { name: config, mountPath: /etc/app }
  volumes:
    - name: config
      configMap: { name: app-config }
---
# probe_failing: runs, but its readiness probe never passes. Its Service
# has no ready endpoints: no_ready_endpoints.
apiVersion: v1
kind: Pod
metadata:
  name: unready
  namespace: issues-test
  labels: { app: unready }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "86400"]
      readinessProbe:
        exec: { command: [test, -f, /tmp/ready] }
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unready
  namespace: issues-test
spec:
  selector: { app: unready }
  ports: [{ port: 80, targetPort: 8080 }]
---
# selector_matches_nothing: the pods are app=web, not web-frontend.
apiVersion: v1
kind: Service
metadata:
  name: typo
  namespace: issues-test
spec:
  selector: { app: web-frontend }
  ports: [{ port: 80 }]
---
# replicas_unavailable (after 2 minutes), then rollout_stuck (its 30-second
# progress deadline): its only image can't be pulled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stuck
  namespace: issues-test
spec:
  replicas: 1
  progressDeadlineSeconds: 30
  selector: { matchLabels: { app: stuck } }
  template:
    metadata: { labels: { app: stuck } }
    spec:
      containers:
        - name: app
          image: registry.invalid/stuck:1
---
# create_failed: its pods name a ServiceAccount that doesn't exist, so its
# ReplicaSet can't create them. replicas_unavailable on the Deployment too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-account
  namespace: issues-test
spec:
  replicas: 1
  selector: { matchLabels: { app: no-account } }
  template:
    metadata: { labels: { app: no-account } }
    spec:
      serviceAccountName: ghost
      containers:
        - name: app
          image: busybox:1.36
          command: [sleep, "86400"]
---
# reference_missing on the Deployment (once, not per pod); its pods can't
# start either: config_missing on each.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-config
  namespace: issues-test
spec:
  replicas: 1
  selector: { matchLabels: { app: no-config } }
  template:
    metadata: { labels: { app: no-config } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: [sleep, "86400"]
          envFrom:
            - configMapRef: { name: feature-flags }
---
# job_failed: no retries, and it fails.
apiVersion: batch/v1
kind: Job
metadata:
  name: report
  namespace: issues-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: app
          image: busybox:1.36
          command: [sh, -c, "echo report failed; exit 1"]
---
# backend_missing: the Ingress sends traffic to a Service that doesn't exist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: old
  namespace: issues-test
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: old-api, port: { number: 80 } }
---
# pvc_unbound (after 2 minutes): no StorageClass of this name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orphan
  namespace: issues-test
spec:
  storageClassName: missing-class
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
# A healthy pod, to compare with: no signal.
apiVersion: v1
kind: Pod
metadata:
  name: fine
  namespace: issues-test
  labels: { app: web }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sleep, "86400"]
