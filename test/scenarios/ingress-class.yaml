# An Ingress for a class nobody runs, with a TLS Secret that doesn't exist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: no-class
  namespace: opscope-scenarios
spec:
  ingressClassName: no-such-class
  tls:
    - hosts: [secure.local]
      secretName: secure-tls
  rules:
    - host: secure.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: readiness, port: {number: 80}}}
