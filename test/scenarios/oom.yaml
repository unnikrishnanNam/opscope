apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom
  namespace: opscope-scenarios
spec:
  replicas: 1
  selector:
    matchLabels: {app: oom}
  template:
    metadata:
      labels: {app: oom}
    spec:

      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            limits: {memory: 32Mi}
          command: ["sh", "-c", "echo filling memory; tail /dev/zero"]
