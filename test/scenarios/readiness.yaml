# The readiness probe always fails: the pod runs, but never receives traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness
  namespace: opscope-scenarios
spec:
  replicas: 1
  selector:
    matchLabels: {app: readiness}
  template:
    metadata:
      labels: {app: readiness}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 3600"]
          resources:
            limits: {memory: 32Mi}
          readinessProbe:
            exec: {command: ["sh", "-c", "test -f /tmp/ready"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: readiness
  namespace: opscope-scenarios
spec:
  selector: {app: readiness}
  ports: [{port: 80}]
