# The init container waits for a Service called "database" that doesn't exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-waits
  namespace: opscope-scenarios
spec:
  replicas: 1
  selector:
    matchLabels: {app: init-waits}
  template:
    metadata:
      labels: {app: init-waits}
    spec:
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nslookup database; do echo waiting for database; sleep 2; done"]
          resources:
            limits: {memory: 32Mi}
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep 3600"]
          resources:
            limits: {memory: 32Mi}
