apiVersion: apps/v1
kind: Deployment
metadata:
  name: over-quota
  namespace: opscope-scenarios
spec:
  replicas: 1
  selector:
    matchLabels: {app: over-quota}
  template:
    metadata:
      labels: {app: over-quota}
    spec:

      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            limits: {memory: 2Gi}
          command: ["sh", "-c", "sleep 3600"]
