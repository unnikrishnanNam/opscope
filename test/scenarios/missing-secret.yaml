apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-secret
  namespace: opscope-scenarios
spec:
  replicas: 1
  selector:
    matchLabels: {app: missing-secret}
  template:
    metadata:
      labels: {app: missing-secret}
    spec:

      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            limits: {memory: 32Mi}
          command: ["sh", "-c", "sleep 3600"]
          env:
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef: {name: stripe-key, key: api-key}
