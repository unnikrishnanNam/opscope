apiVersion: apps/v1
kind: Deployment
metadata:
  name: unschedulable
  namespace: opscope-scenarios
spec:
  replicas: 1
  selector:
    matchLabels: {app: unschedulable}
  template:
    metadata:
      labels: {app: unschedulable}
    spec:

      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            limits: {memory: 32Mi}
            requests: {cpu: "64"}
          command: ["sh", "-c", "sleep 3600"]
