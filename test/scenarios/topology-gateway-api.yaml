# Gateway API for the topology scenarios: a GatewayClass, a Gateway with a
# TLS listener, and an HTTPRoute to the api Service and to one that doesn't
# exist. Needs the Gateway API CRDs and topology.yaml applied first; no
# controller is needed, since the graph reads the objects, not their status.
# See README.md in this folder.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: graph-test
spec:
  controllerName: example.com/no-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: graph-test
spec:
  gatewayClassName: graph-test
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: tls-cert
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: store
  namespace: graph-test
spec:
  parentRefs:
    - name: edge
      sectionName: https
  rules:
    - backendRefs:
        - name: api
          port: 80
        - name: missing-svc
          port: 80
