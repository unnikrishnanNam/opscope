# Services that exist, with pods that serve: web next to the routes, and
# catalog and reviews in another namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: opscope-edge
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["httpd", "-f", "-p", "8080"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: opscope-edge
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: opscope-backends
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      containers:
        - name: catalog
          image: busybox:1.36
          command: ["httpd", "-f", "-p", "8080"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: opscope-backends
spec:
  selector: {app: catalog}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: reviews
  namespace: opscope-backends
spec:
  selector: {app: catalog}
  ports: [{port: 80, targetPort: 8080}]
