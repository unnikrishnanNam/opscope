# A GatewayClass whose controller isn't installed: nothing ever accepts it,
# so its Gateway is never programmed. After 5 minutes Opscope says so.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: opscope-nobody
spec:
  controllerName: example.com/no-such-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: opscope-edge
spec:
  gatewayClassName: opscope-nobody
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: All}
