# Pods that can only run on the node labelled opscope-scenario=node-down.
# Label a worker node, apply this, then stop that node (see the README).
apiVersion: v1
kind: Namespace
metadata:
  name: opscope-node-down
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinned
  namespace: opscope-node-down
spec:
  replicas: 2
  selector:
    matchLabels: {app: pinned}
  template:
    metadata:
      labels: {app: pinned}
    spec:
      nodeSelector: {opscope-scenario: node-down}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "infinity"]
