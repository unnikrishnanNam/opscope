apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-configmap
  namespace: opscope-scenarios
spec:
  replicas: 1
  selector:
    matchLabels: {app: missing-configmap}
  template:
    metadata:
      labels: {app: missing-configmap}
    spec:
      volumes:
        - name: config
          configMap: {name: app-config}
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            limits: {memory: 32Mi}
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - {name: config, mountPath: /config}
