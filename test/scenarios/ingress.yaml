# Traffic for /api goes to a Service that doesn't exist; traffic for / goes to
# one whose pods crash.
apiVersion: v1
kind: Service
metadata:
  name: crash-loop
  namespace: opscope-scenarios
spec:
  selector: {app: crash-loop}
  ports: [{port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: opscope-scenarios
spec:
  rules:
    - host: shop.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: api, port: {number: 80}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: crash-loop, port: {number: 80}}}
