apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-loop
  namespace: opscope-scenarios
spec:
  replicas: 2
  selector:
    matchLabels: {app: crash-loop}
  template:
    metadata:
      labels: {app: crash-loop}
    spec:

      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            limits: {memory: 32Mi}
          command: ["sh", "-c", "echo starting; echo cannot connect to database >&2; exit 1"]
