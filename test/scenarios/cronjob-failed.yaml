# Runs every minute and fails every time.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-failed
  namespace: opscope-scenarios
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "echo no data >&2; exit 1"]
              resources:
                limits: {memory: 32Mi}
