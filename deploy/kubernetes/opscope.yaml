# Opscope running inside the cluster it shows.
#
#   kubectl apply -f deploy/kubernetes/
#   kubectl -n opscope port-forward svc/opscope 8080:80
#   open http://localhost:8080
#
# Opscope has no login of its own: anyone who can reach this Service can read
# everything the ClusterRole below allows. That's why the Service is
# ClusterIP only and the README uses port-forward. Don't expose it with an
# Ingress or LoadBalancer unless something in front of it adds authentication.
#
# Secret access is in a separate file (secrets-access.yaml) so it's easy to
# leave out.

apiVersion: v1
kind: Namespace
metadata:
  name: opscope
---
# The identity Opscope uses to talk to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opscope
  namespace: opscope
---
# Read-only access to everything Opscope shows (except Secrets).
# Only "get" and "list": Opscope never creates, changes or deletes anything,
# and it polls instead of watching.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opscope-read
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, services, configmaps, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log] # the Logs tab
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io] # Gateway API; harmless if it isn't installed
    resources: [gateways, httproutes, gatewayclasses]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io] # metrics-server, for CPU and memory usage
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opscope-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opscope-read
subjects:
  - kind: ServiceAccount
    name: opscope
    namespace: opscope
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opscope
  namespace: opscope
  labels:
    app: opscope
spec:
  replicas: 1 # usage history is kept in memory, so one copy keeps it consistent
  selector:
    matchLabels:
      app: opscope
  template:
    metadata:
      labels:
        app: opscope
    spec:
      serviceAccountName: opscope
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the "nonroot" user of the distroless image
        runAsGroup: 65532
        fsGroup: 65532 # makes the /data volume writable for that user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opscope
          # Build and load the image first; see the README. For kind:
          #   make docker-build && kind load docker-image opscope:dev --name <cluster>
          image: opscope:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: OPSCOPE_IN_CLUSTER
              value: "true"
            - name: OPSCOPE_CLUSTER_NAME
              value: "this cluster"
          ports:
            - name: http
              containerPort: 8080
          # Liveness: restart the container if the server stops answering.
          # Readiness: only send traffic once it answers.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true # Opscope only writes to /data
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Clusters added in the UI are saved here. An emptyDir is wiped when the
        # pod is replaced; use a PersistentVolumeClaim to keep them.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opscope
  namespace: opscope
spec:
  type: ClusterIP
  selector:
    app: opscope
  ports:
    - name: http
      port: 80
      targetPort: http
