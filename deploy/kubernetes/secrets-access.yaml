# Optional: lets OpScope list Secrets and reveal their values.
#
# The UI hides values until you click "Reveal" on one key, but with this
# role the OpScope pod itself can read every Secret in the cluster, and so
# can anyone who can reach OpScope. Leave this file out (or delete these two
# objects) if you don't want that; the Secrets pages then show a
# "not allowed" message and everything else keeps working.
#
#   kubectl delete -f deploy/kubernetes/secrets-access.yaml

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opscope-read-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opscope-read-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opscope-read-secrets
subjects:
  - kind: ServiceAccount
    name: opscope
    namespace: opscope
