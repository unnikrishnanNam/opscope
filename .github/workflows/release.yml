# Publishes the Opscope image to the GitHub Container Registry (GHCR) for
# every version tag, built for amd64 and arm64 in one multi-platform image:
#
#   git tag -a v1.2.0 -m "Release v1.2.0" && git push origin v1.2.0
#
# gives ghcr.io/<owner>/opscope:v1.2.0, :1.2 and :latest. It can also be run
# by hand from the Actions tab for a tag that already exists (e.g. v1.1.0).
#
# Before anything is pushed, the tag's tests run (ci.yml) and the deploy
# manifest is checked to use this release's image (.github/scripts/
# check-manifest-tag.sh). If either fails, nothing is published.
#
# Pushing uses the workflow's own GITHUB_TOKEN, so no secrets are needed.
# A new package starts out private on GHCR: make it public once under the
# package's settings so anyone can pull it.
#
# Actions are pinned to a commit (the comment says which version); see ci.yml.

name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v1.1.0"
        required: true

permissions:
  contents: read
  packages: write # push to ghcr.io

# The tag being released: the pushed tag, or the one typed in by hand.
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
    with:
      # `env` can't be read here, so this repeats TAG's expression.
      ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  manifest:
    name: Manifest uses this release
    runs-on: ubuntu-latest
    steps:
      # The script comes from this workflow's own commit, the manifest from
      # the tag: run by hand, this workflow is main's, and an older tag may
      # not have the script yet.
      - name: Check out this workflow's commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          path: release

      - name: Check the image tag in deploy/kubernetes/opscope.yaml
        run: .github/scripts/check-manifest-tag.sh "$TAG" release/deploy/kubernetes/opscope.yaml

  image:
    needs: [tests, manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}

      # GHCR image names must be lowercase; GitHub owner names may not be.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opscope" >> "$GITHUB_ENV"

      - name: Set up QEMU (to build arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.0 -> tags v1.2.0, 1.2 and latest, plus standard OCI labels
      # (source repo, version, revision) so GHCR links the image to the repo.
      # A pre-release (v1.3.0-rc.1) gets only its own tag: "latest" and
      # "1.3" stay on the last real release.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          labels: |
            org.opencontainers.image.title=Opscope
            org.opencontainers.image.description=A small, read-only Kubernetes dashboard

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
