# Dependabot keeps the GitHub Actions in .github/workflows/ up to date. They
# are pinned to a commit, so a changed tag upstream can't change what runs;
# Dependabot opens one pull request a week with any updates (new commit and
# version comment), and CI checks it like any other change.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
